[package]
name = "bytebeat-cli"
version = "0.1.3"
edition = "2024"
description = "An LLVM-powered program to JIT-compile bytebeats and play them through your speaker."
license = "MIT"
repository = "https://github.com/balt-dev/bytebeat-rs"

[dependencies]
cpal = "0.15"
clap = {version = "4", features = ["derive"]}
bytebeat-rs = {version = "0.1", path = "../lib"}
ctrlc = "3"